<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Run Jory Run — Tile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── 캔버스 세팅 ──────────────────────────────────────
const C = document.getElementById('c');
const cx = C.getContext('2d');

const W = 360, H = 640;
const DPR = window.devicePixelRatio || 1;
C.width = W * DPR; C.height = H * DPR;
cx.scale(DPR, DPR);

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  C.style.width  = W * s + 'px';
  C.style.height = H * s + 'px';
}
resize();
window.addEventListener('resize', resize);

// ── 그리드 상수 ───────────────────────────────────────
const N_COLS = 6;
const TILE = W / N_COLS; // 60px

// ── 이미지 로딩 ──────────────────────────────────────
const foodImgs = Array.from({ length: 16 }, (_, i) => {
  const img = new Image(); img.src = `food${i}.png`; return img;
});

const tireImg = new Image();
tireImg.src = 'obs_tire.png';

const imgs = {
  front1: new Image(), front2: new Image(),
  left: new Image(), right: new Image(),
};
imgs.front1.src = 'jori-front1.png';
imgs.front2.src = 'jori-front2.png';
imgs.left.src   = 'jori-left2.png';
imgs.right.src  = 'jori-right2.png';

const titleImg = new Image();
titleImg.src = 'title-runjoryrun.png';

const bgImg = new Image();
bgImg.src = 'road-bg.png';
let bgY = 0;

// ── 색상 ─────────────────────────────────────────────
const COL = {
  bg:      '#0a0e1a',
  primary: '#fa0050',
  gold:    '#f5c400',
  white:   '#ffffff',
};

// ── 게임 상태 ────────────────────────────────────────
let S = 'start'; // 'start' | 'play' | 'over'
let score = 0, hi = 0, combo = 0, frame = 0;
let rows = [];
let rowSpeed = 2.5;
let lastRowY = -9999;
let popups = [];
let particles = [];

// ── 플레이어 ─────────────────────────────────────────
const P = {
  col: 2,
  y: H - 110,
  lives: 3,
  inv: 0,    // 피격 후 무적 프레임
};

// ── 입력 ─────────────────────────────────────────────
const keys = {};
let moveHoldLeft = 0, moveHoldRight = 0;
const MOVE_INITIAL_DELAY = 18;
const MOVE_REPEAT_DELAY  = 6;

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (S !== 'play' && (e.key === ' ' || e.key === 'Enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ── 터치 조작 ────────────────────────────────────────
C.addEventListener('touchstart', e => {
  e.preventDefault();
  if (S !== 'play') { startGame(); return; }
  const touch = e.touches[0];
  const rect  = C.getBoundingClientRect();
  const x     = (touch.clientX - rect.left) * (W / rect.width);
  if (x < W / 2) {
    P.col = Math.max(0, P.col - 1);
  } else {
    P.col = Math.min(N_COLS - 1, P.col + 1);
  }
}, { passive: false });

// ── 입력 처리 ────────────────────────────────────────
function processInput() {
  const wantLeft  = keys['ArrowLeft']  || keys['a'] || keys['A'];
  const wantRight = keys['ArrowRight'] || keys['d'] || keys['D'];

  if (wantLeft) {
    moveHoldLeft++;
    if (moveHoldLeft === 1 || (moveHoldLeft > MOVE_INITIAL_DELAY && moveHoldLeft % MOVE_REPEAT_DELAY === 0)) {
      P.col = Math.max(0, P.col - 1);
    }
  } else { moveHoldLeft = 0; }

  if (wantRight) {
    moveHoldRight++;
    if (moveHoldRight === 1 || (moveHoldRight > MOVE_INITIAL_DELAY && moveHoldRight % MOVE_REPEAT_DELAY === 0)) {
      P.col = Math.min(N_COLS - 1, P.col + 1);
    }
  } else { moveHoldRight = 0; }
}

// ── 게임 시작/리셋 ───────────────────────────────────
function startGame() {
  S = 'play';
  score = 0; combo = 0; frame = 0;
  P.col = 2; P.lives = 3; P.inv = 0;
  rows = []; popups = []; particles = [];
  rowSpeed = 2.5;
  lastRowY = -9999;
  moveHoldLeft = 0; moveHoldRight = 0;
  bgY = 0;
}

// ── Row 스폰 ─────────────────────────────────────────
function spawnRow() {
  // 연속 같은 gap 방지: 이전 row와 다른 칸 선택
  const prev = rows.length > 0 ? rows[rows.length - 1].gapCol : -1;
  let gapCol;
  do { gapCol = Math.floor(Math.random() * N_COLS); } while (gapCol === prev && N_COLS > 1);

  rows.push({
    y: -TILE,
    gapCol,
    speed: rowSpeed,
    passed: false,
    food: Math.random() < 0.7,
    foodIdx: Math.floor(Math.random() * 16),
    hit: false,     // 이 줄에서 이미 피격됐는지 (중복 방지)
  });
  lastRowY = -TILE;
}

// ── 파티클 & 팝업 헬퍼 ──────────────────────────────
function burst(x, y, col, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 / n) * i + Math.random() * 0.5;
    const s = 2 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, alpha: 1, col, sz: 3 + Math.random() * 3 });
  }
}
function popup(x, y, t, col) {
  popups.push({ x, y, txt: t, col, alpha: 1, vy: -2 });
}

// ── 업데이트 ─────────────────────────────────────────
function update() {
  frame++;
  if (S !== 'play') return;

  // 속도 증가
  rowSpeed = 2.5 + Math.min(score / 500, 1) * 2.5;

  processInput();

  // 배경 스크롤
  const bgImg_h = bgImg.naturalHeight > 0 ? bgImg.naturalHeight * (W / bgImg.naturalWidth) : H;
  bgY += rowSpeed;
  if (bgY >= bgImg_h) bgY -= bgImg_h;

  // Row 스폰 — 마지막 row가 충분히 내려왔을 때 새 row 생성
  const spacing = Math.max(180, 320 - score * 0.5);
  if (rows.length === 0 || (rows[rows.length - 1].y > -TILE + spacing)) {
    spawnRow();
  }

  // Row 업데이트
  const pX = P.col * TILE + TILE / 2;
  const pY = P.y + TILE / 2; // 플레이어 중심 Y

  rows = rows.filter(row => {
    row.y += row.speed;

    // 충돌 판정: row가 플레이어와 겹치는 Y 구간
    const rowTop    = row.y;
    const rowBottom = row.y + TILE;
    const pTop      = P.y;
    const pBottom   = P.y + TILE;

    if (!row.passed && !row.hit && rowBottom >= pTop && rowTop <= pBottom) {
      if (P.col === row.gapCol) {
        // 통과
        row.passed = true;
        combo++;
        const pts = 10 * (combo >= 5 ? 2 : 1) + (row.food ? 5 : 0);
        score += pts;
        if (score > hi) hi = score;
        burst(pX, P.y, combo >= 5 ? COL.gold : '#ffffff', 8);
        popup(pX, P.y - 20, `+${pts}`, combo >= 5 ? COL.gold : '#ffffff');
      } else {
        // 피격
        if (P.inv === 0) {
          row.hit = true;
          P.lives--;
          P.inv = 90;
          combo = 0;
          burst(pX, P.y, COL.primary, 14);
          popup(pX, P.y - 20, '-1 LIFE', COL.primary);
          if (P.lives <= 0) {
            S = 'over';
            if (score > hi) hi = score;
          }
        }
      }
    }

    return row.y < H + TILE;
  });

  // 무적 카운터
  if (P.inv > 0) P.inv--;

  // 파티클
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.alpha -= 0.028;
    return p.alpha > 0;
  });
  popups = popups.filter(p => {
    p.y += p.vy; p.alpha -= 0.022; return p.alpha > 0;
  });
}

// ── 드로우 헬퍼 ──────────────────────────────────────
function btxt(t, x, y, sz, col, align = 'center') {
  cx.font = `bold ${sz}px Pretendard, -apple-system, sans-serif`;
  cx.fillStyle = col; cx.textAlign = align; cx.textBaseline = 'middle';
  cx.fillText(t, x, y);
}
function txt(t, x, y, sz, col, align = 'center') {
  cx.font = `${sz}px Pretendard, -apple-system, sans-serif`;
  cx.fillStyle = col; cx.textAlign = align; cx.textBaseline = 'middle';
  cx.fillText(t, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, sw = 1) {
  cx.beginPath();
  cx.moveTo(x + r, y); cx.lineTo(x + w - r, y); cx.arcTo(x + w, y, x + w, y + r, r);
  cx.lineTo(x + w, y + h - r); cx.arcTo(x + w, y + h, x + w - r, y + h, r);
  cx.lineTo(x + r, y + h); cx.arcTo(x, y + h, x, y + h - r, r);
  cx.lineTo(x, y + r); cx.arcTo(x, y, x + r, y, r);
  cx.closePath();
  if (fill)   { cx.fillStyle = fill; cx.fill(); }
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = sw; cx.stroke(); }
}

// ── 배경 ─────────────────────────────────────────────
function drawBG() {
  cx.fillStyle = '#2a3a1a';
  cx.fillRect(0, 0, W, H);

  if (bgImg.naturalWidth > 0) {
    const scale  = W / bgImg.naturalWidth;
    const bh     = bgImg.naturalHeight * scale;
    const startY = bgY - bh;
    for (let i = 0; i < 3; i++) cx.drawImage(bgImg, 0, startY + bh * i, W, bh);
  }

  // 그리드 세로선
  cx.strokeStyle = 'rgba(255,255,255,0.05)';
  cx.lineWidth = 1;
  for (let i = 1; i < N_COLS; i++) {
    cx.beginPath(); cx.moveTo(i * TILE, 0); cx.lineTo(i * TILE, H); cx.stroke();
  }
}

// ── 플레이어 열 강조 ──────────────────────────────────
function drawColumnHighlight() {
  cx.fillStyle = 'rgba(255,255,255,0.07)';
  cx.fillRect(P.col * TILE, 0, TILE, H);
}

// ── Row 드로우 ────────────────────────────────────────
function drawRows() {
  rows.forEach(row => {
    for (let c = 0; c < N_COLS; c++) {
      if (c === row.gapCol) {
        // gap: 연한 강조
        cx.fillStyle = 'rgba(255,255,255,0.06)';
        cx.fillRect(c * TILE, row.y, TILE, TILE);
        // gap 음식
        if (row.food) {
          const img = foodImgs[row.foodIdx];
          if (img && img.complete && img.naturalWidth > 0) {
            cx.drawImage(img, c * TILE + 6, row.y + 6, TILE - 12, TILE - 12);
          }
        }
      } else {
        // 장애물
        if (tireImg.complete && tireImg.naturalWidth > 0) {
          cx.drawImage(tireImg, c * TILE + 3, row.y + 3, TILE - 6, TILE - 6);
        } else {
          cx.fillStyle = '#ff3333';
          cx.fillRect(c * TILE + 3, row.y + 3, TILE - 6, TILE - 6);
        }
      }
    }
    // gap 화살표 표시 (갭 위치 힌트)
    cx.fillStyle = 'rgba(255,255,255,0.55)';
    cx.font = '14px serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('▼', row.gapCol * TILE + TILE / 2, row.y + TILE / 2);
  });
}

// ── 플레이어 (조리) ───────────────────────────────────
function drawPlayer() {
  const blink = P.inv > 0 && Math.floor(P.inv / 6) % 2 === 0;
  if (blink) return;

  const px = P.col * TILE;
  const py = P.y;

  // 그림자
  cx.globalAlpha = 0.2;
  cx.fillStyle = '#000';
  cx.beginPath();
  cx.ellipse(px + TILE / 2, py + TILE + 4, TILE * 0.38, 7, 0, 0, Math.PI * 2);
  cx.fill();
  cx.globalAlpha = 1;

  // 조리 이미지 (앞면 2프레임 번갈아)
  const useF1 = Math.floor(frame / 20) % 2 === 0;
  const img = useF1 ? imgs.front1 : imgs.front2;
  if (img.complete && img.naturalWidth > 0) {
    cx.drawImage(img, px, py, TILE, TILE);
  } else {
    cx.font = `${TILE * 0.75}px serif`;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('🐥', px + TILE / 2, py + TILE / 2);
  }

  // 무적 링
  if (P.inv > 0) {
    cx.strokeStyle = `rgba(250,0,80,${P.inv / 90 * 0.7})`;
    cx.lineWidth = 2;
    cx.beginPath();
    cx.arc(px + TILE / 2, py + TILE / 2, TILE * 0.6, 0, Math.PI * 2);
    cx.stroke();
  }
}

// ── HUD ──────────────────────────────────────────────
function drawHUD() {
  // 상단 반투명 바
  const g = cx.createLinearGradient(0, 0, 0, 56);
  g.addColorStop(0, 'rgba(10,14,26,0.92)');
  g.addColorStop(1, 'rgba(10,14,26,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, W, 56);

  // 점수
  btxt(score.toLocaleString(), 16, 20, 18, COL.gold, 'left');
  txt('SCORE', 16, 36, 8, 'rgba(255,255,255,0.3)', 'left');

  // 하이스코어
  if (hi > 0) btxt(`BEST ${hi.toLocaleString()}`, W / 2, 20, 11, 'rgba(255,255,255,0.4)');

  // 라이프
  for (let i = 0; i < 3; i++) {
    cx.globalAlpha = i < P.lives ? 1 : 0.18;
    cx.font = '14px serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('❤️', W - 20 - i * 24, 20);
  }
  cx.globalAlpha = 1;

  // 콤보
  if (combo >= 3) {
    const col = combo >= 10 ? '#ff9900' : combo >= 5 ? COL.gold : 'rgba(255,255,255,0.8)';
    cx.globalAlpha = 0.85 + Math.sin(frame * 0.22) * 0.15;
    btxt(`×${combo} COMBO`, W / 2, 52, combo >= 5 ? 14 : 12, col);
    cx.globalAlpha = 1;
  }

  // 하단 속도바
  const pct = Math.min((rowSpeed - 2.5) / 2.5, 1);
  cx.fillStyle = 'rgba(255,255,255,0.05)'; cx.fillRect(0, H - 3, W, 3);
  if (pct > 0) {
    const sg = cx.createLinearGradient(0, 0, W * pct, 0);
    sg.addColorStop(0, COL.primary); sg.addColorStop(1, COL.gold);
    cx.fillStyle = sg; cx.fillRect(0, H - 3, W * pct, 3);
  }
}

// ── FX ───────────────────────────────────────────────
function drawFX() {
  particles.forEach(p => {
    cx.globalAlpha = p.alpha;
    cx.fillStyle = p.col;
    cx.beginPath(); cx.arc(p.x, p.y, p.sz, 0, Math.PI * 2); cx.fill();
  });
  cx.globalAlpha = 1;

  popups.forEach(p => {
    cx.globalAlpha = p.alpha;
    btxt(p.txt, p.x, p.y, 13, p.col);
  });
  cx.globalAlpha = 1;
}

// ── 시작 화면 ────────────────────────────────────────
function drawStart() {
  const floatY = Math.sin(frame * 0.04) * 8;

  if (titleImg.complete && titleImg.naturalWidth > 0) {
    const imgW = Math.min(320, W * 0.82);
    const imgH = imgW * (titleImg.naturalHeight / titleImg.naturalWidth);
    cx.drawImage(titleImg, W / 2 - imgW / 2, 70 + floatY, imgW, imgH);
  } else {
    cx.shadowColor = COL.primary; cx.shadowBlur = 20;
    btxt('Run Jory Run', W / 2, 180, 34, COL.white);
    cx.shadowBlur = 0;
  }

  // 조리 바운스
  const bounce = Math.abs(Math.sin(frame * 0.12)) * 10;
  const joriY  = H - 200 - bounce;
  const jImg   = Math.floor(frame / 18) % 2 === 0 ? imgs.front1 : imgs.front2;
  if (jImg.complete && jImg.naturalWidth > 0) {
    cx.drawImage(jImg, W / 2 - TILE, joriY, TILE * 2, TILE * 2);
  }

  // 그림자
  cx.globalAlpha = 0.2; cx.fillStyle = '#000';
  cx.beginPath(); cx.ellipse(W / 2, H - 140, 36 + bounce, 9, 0, 0, Math.PI * 2); cx.fill();
  cx.globalAlpha = 1;

  // 시작 버튼
  const pulse = 1 + Math.sin(frame * 0.07) * 0.03;
  cx.save(); cx.translate(W / 2, H - 110); cx.scale(pulse, pulse);
  rrect(-100, -22, 200, 44, 22, COL.primary);
  btxt('탭하여 시작', 0, 0, 16, '#fff');
  cx.restore();

  if (hi > 0) {
    cx.font = '14px serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('🏆', W / 2 - 46, H - 62);
    txt(`최고 기록  ${hi.toLocaleString()}`, W / 2 + 12, H - 62, 13, COL.gold);
  }

  // 조작법 안내
  txt('← → 키  또는  화면 좌/우 터치', W / 2, H - 36, 10, 'rgba(255,255,255,0.35)');
}

// ── 게임오버 화면 ────────────────────────────────────
function drawOver() {
  cx.fillStyle = 'rgba(10,14,26,0.84)'; cx.fillRect(0, 0, W, H);

  // 뒤집힌 조리
  cx.save(); cx.translate(W / 2, 185); cx.rotate(Math.PI);
  const jImg = imgs.front1;
  if (jImg.complete && jImg.naturalWidth > 0) {
    cx.drawImage(jImg, -TILE * 0.7, -TILE * 0.7, TILE * 1.4, TILE * 1.4);
  }
  cx.restore();

  btxt('GAME OVER', W / 2, 258, 26, COL.white);

  rrect(50, 282, W - 100, 96, 14, 'rgba(255,255,255,0.06)', 'rgba(255,255,255,0.1)', 1);
  btxt(score.toLocaleString(), W / 2, 320, 38, COL.gold);
  txt('이번 기록', W / 2, 358, 11, 'rgba(255,255,255,0.35)');

  if (score >= hi) {
    cx.shadowColor = COL.gold; cx.shadowBlur = 18;
    btxt('🏆 신기록!', W / 2, 396, 14, COL.gold);
    cx.shadowBlur = 0;
  } else if (hi > 0) {
    txt(`최고 기록  ${hi.toLocaleString()}`, W / 2, 396, 12, 'rgba(255,255,255,0.3)');
  }

  // 재시작
  const by = 500, pulse = 1 + Math.sin(frame * 0.09) * 0.02;
  cx.save(); cx.translate(W / 2, by); cx.scale(pulse, pulse);
  rrect(-100, -22, 200, 44, 22, COL.primary);
  btxt('다시 도전', 0, 0, 16, '#fff');
  cx.restore();

  txt('탭 또는 스페이스', W / 2, by + 34, 10, 'rgba(255,255,255,0.3)');

  // 탭으로 재시작
  C.onclick = () => { if (S === 'over') startGame(); };
}

// ── 메인 루프 ────────────────────────────────────────
const TARGET_MS = 1000 / 60;
let lastTime = 0;

function loop(now) {
  requestAnimationFrame(loop);
  const dt = now - lastTime;
  if (dt < TARGET_MS - 1) return;
  lastTime = now - (dt % TARGET_MS);

  update();
  drawBG();
  if (S === 'play') {
    drawColumnHighlight();
    drawRows();
    drawFX();
    drawPlayer();
    drawHUD();
  } else if (S === 'start') {
    drawStart();
  } else if (S === 'over') {
    drawColumnHighlight();
    drawRows();
    drawFX();
    drawPlayer();
    drawHUD();
    drawOver();
  }
}

// 시작 화면 탭
C.addEventListener('click', () => {
  if (S === 'start') startGame();
  else if (S === 'over') startGame();
});

requestAnimationFrame(loop);
</script>
</body>
</html>
